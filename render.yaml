# Blueprint de Render para la app de clientes (Flutter web / PWA).
# Render → New → Blueprint → elige este repositorio.
services:
  - type: web
    name: djulio-app
    runtime: static
    branch: main
    buildCommand: bash build-web.sh
    staticPublishPath: build/web
    autoDeploy: true
    envVars:
      - key: FLUTTER_VERSION
        value: "3.38.5"
    # La app usa rutas con # (/#/products), pero cualquier ruta debe abrir la app
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Archivos que cambian en cada versión: siempre frescos
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /flutter_bootstrap.js
        name: Cache-Control
        value: no-cache
      - path: /flutter_service_worker.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.json
        name: Cache-Control
        value: no-cache
      - path: /version.json
        name: Cache-Control
        value: no-cache
      # Cabeceras de seguridad para todo el sitio
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss://*.firebaseio.com; worker-src 'self' blob:; frame-src https://*.firebaseapp.com https://apis.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
      - path: /*
        name: X-Content-Type-Options
        value: "nosniff"
      - path: /*
        name: X-Frame-Options
        value: "DENY"
      - path: /*
        name: Referrer-Policy
        value: "strict-origin-when-cross-origin"
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(self), payment=()"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=63072000; includeSubDomains"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: "same-origin-allow-popups"
